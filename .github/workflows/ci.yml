name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh scripts/build.sh scripts/test.sh
      - name: Test
        run: ./scripts/test.sh
      - name: Build
        run: ./scripts/build.sh
      - name: Verify signed app
        run: codesign --verify --deep --strict dist/SnapClip.app
